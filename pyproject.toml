[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskbot"
version = "0.0.1"
description = "Text-to-robot design with an LLM in the loop."
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy>=1.24", "lxml>=5", "mujoco>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
taskbot = "taskbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taskbot = ["data/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
