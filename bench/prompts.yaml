# TaskBot benchmark prompts. Loaded and validated by taskbot.bench (see README, "Running
# the benchmark"). Every prompt has an id, a category and expectations about the
# requirements the model extracts:
#   robot_type        one type or a list of acceptable types
#   should_reject     true: the task is out of scope and must stop without a design
#   min_reach_m       requirements.reach_m must be at least this
#   payload_kg        [min, max] for requirements.payload_kg (in the gripper, margin included)
#   base_payload_kg   [min, max] for requirements.base_payload_kg (carried on the base)
#   tolerance_m       [min, max] for requirements.position_tolerance_m
#   terrain           expected terrain for mobile types
# Ranges are deliberately wide: they catch physically wrong numbers, not style.
# Prompts marked "from Task 5.1" are the five original hand-run prompts.

- id: easy_arm_water_plants
  category: easy_arm
  note: from Task 5.1
  prompt: Water the three potted plants on my windowsill
  expect:
    robot_type: arm
    min_reach_m: 0.25
    payload_kg: [0.2, 2.0]
    tolerance_m: [0.003, 0.03]

